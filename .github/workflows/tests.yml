name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    # Host-logic tests only: no tablet, no GPU, no KDE session.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the host's Python bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-dbus gir1.2-glib-2.0 gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-base
          python3 -m pip install --break-system-packages 'websockets>=13'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
